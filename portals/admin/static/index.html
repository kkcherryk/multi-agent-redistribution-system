<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host Admin Portal</title>
<link rel="stylesheet" href="/static/common/portal.css">
<style>:root{--accent:#6e40c9}</style>
</head><body>
<header><h1>Host Admin Portal</h1><div><button id="logout" class="hidden" type="button">Sign out</button>
<a id="home" href="#">All portals</a></div></header>
<main>
  <section id="auth" class="panel hidden">
    <div class="tabs"><button type="button" data-mode="login" class="active">Sign in</button></div>
    <form id="login-form" autocomplete="on">
      <label for="l-email">Email</label><input id="l-email" name="email" type="email" required autocomplete="username">
      <label for="l-pass">Password</label><input id="l-pass" name="password" type="password" required autocomplete="current-password">
      <button class="primary" type="submit">Sign in</button>
      <div id="login-msg" class="msg"></div>
    </form><p class="note">Host accounts are created and managed by the project team.</p>
  </section>
  <section id="dashboard" class="hidden">
    <div class="panel"><h2 id="welcome"></h2><dl id="profile"></dl>
      <p id="pending-note" class="note hidden"></p></div>
    <div class="panel"><h2>Accounts</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Status</th><th>Created</th></tr></thead><tbody id="accounts"></tbody></table></div></div>
    <div class="panel"><h2>Recent activity</h2><div class="table-wrap"><table><thead><tr><th>Time</th><th>Event</th><th>Portal</th><th>Subject</th></tr></thead><tbody id="events"></tbody></table></div></div>
  </section>
</main>
<script>
window.PORTAL = { title: 'Host Admin Portal' };
window.PORTAL.onSignedIn = async (acc, ui) => {
  const [accounts, events] = await Promise.all([ui.api("/accounts"), ui.api("/events?limit=25")]);
  const byId = Object.fromEntries(accounts.map((a) => [a.id, a.display_name]));
  const tb = document.getElementById("accounts"); tb.replaceChildren();
  for (const a of accounts) {
    const tr = ui.el("tr");
    tr.append(ui.el("td", {}, a.display_name), ui.el("td", {}, a.role), ui.el("td", {}, a.email));
    const st = ui.el("td"); st.append(ui.statusChip(a.status)); tr.append(st);
    tr.append(ui.el("td", {}, new Date(a.created_at).toLocaleString())); tb.append(tr);
  }
  const te = document.getElementById("events"); te.replaceChildren();
  for (const ev of events) {
    const tr = ui.el("tr");
    tr.append(ui.el("td", {}, new Date(ev.created_at).toLocaleString()), ui.el("td", {}, ev.type),
              ui.el("td", {}, ev.portal || "—"), ui.el("td", {}, byId[ev.subject_id] || ev.subject_id || "—"));
    te.append(tr);
  }
};
</script>
<script src="/static/common/portal.js"></script>
</body></html>
